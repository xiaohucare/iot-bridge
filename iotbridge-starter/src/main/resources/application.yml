server:
  port: 8080

spring:
  application:
    name: iotbridge
  # Kafka：上行数据投递（本项为 Kafka 生产者唯一配置来源，代码不再硬编码）
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      # 可靠性：全部 ISR 副本确认 + 幂等生产者（重试不产生重复），防 broker 端抖动丢消息
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        # broker 不可用/缓冲满时的最长阻塞：快速失败而不是阻塞默认 60s（上行处理线程会随之中断该分片）
        max.block.ms: 3000
  # RabbitMQ：下行指令收发
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # 发布确认：correlated 模式支持按条同步等待 broker confirm
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动确认：处理成功 ack，毒消息 nack 不重回队列、经死信参数转入 <下行队列>.dlq
        acknowledge-mode: manual
        default-requeue-rejected: false
        concurrency: 2
        max-concurrency: 8

# 网关自定义配置
iotbridge:
  protocol:
    # 默认协议类型：仅作为「未绑定端口的上行/未指定 protocolType 的下行」的中性兜底（示例协议 demo-text）。
    # 多协议部署请显式配置 listeners[].protocol-type，下行指令显式携带 protocolType，勿依赖默认兜底。
    default: demo-text
  netty:
    # 全局默认（监听项未显式配置的字段继承自这里；未配置 listeners 时用这些扁平字段合成单一监听）
    host: 0.0.0.0
    port: 9000
    boss-threads: 1
    worker-threads: 0
    # 二进制帧按长度字段切分：SOS 整帧上限较小，限 1024 防异常大包
    max-frame-length: 1024
    # 帧切分模式：DELIMITER 行分隔(文本协议) / LENGTH_FIELD 长度字段(二进制协议)
    frame-mode: LENGTH_FIELD
    # 帧头3+版本1+厂商2+序列2+命令1 = 偏移9，长度2，数据体后还有 CRC(2)+帧尾(3)=5 字节计入整帧
    length-field-offset: 9
    length-field-length: 2
    length-adjustment: 5
    initial-bytes-to-strip: 0
    # 读空闲超时（秒）：超时未收到上行即关闭连接，清理设备断电/NAT 超时留下的半开连接；<=0 关闭检测。
    # 应大于设备心跳间隔（SOS 心跳 60s 时建议 180s）。
    reader-idle-seconds: 180
    # 出站写缓冲水位（字节）：超过高水位视为不可写，下行改走离线暂存，防止慢设备撑爆内存
    write-buffer-high-water-mark: 65536
    write-buffer-low-water-mark: 32768
    # 多协议监听：每个端口绑定一种上行协议及其切帧方式，未填项继承上面的全局默认。
    # 留空 listeners 则退回上面的单一全局监听（向后兼容）。
    listeners:
      # 9000：SOS-C02 二进制协议，继承全局 LENGTH_FIELD(偏移9/长度2/修正5/上限1024)
      - name: sos
        port: 9000
        protocol-type: sos-c02
      # 9001：demo-text 文本协议，改用行分隔切帧（覆盖 frame-mode 与 max-frame-length）
      - name: demo-text
        port: 9001
        protocol-type: demo-text
        frame-mode: DELIMITER
        max-frame-length: 65536
  # 上行处理线程池：解码/会话登记/Kafka 投递在工作线程执行，不占用 Netty IO 线程。
  # 按远端地址哈希分片，同连接帧有序；队列有界，溢出丢弃并告警形成背压保护。
  uplink:
    worker-threads: 4
    queue-capacity: 10000
  # MQTT 3.1.1 设备接入（内置轻量 Broker）：clientId 即设备号，上行 PUBLISH 走同一套解码/投递链路
  mqtt:
    enabled: true
    host: 0.0.0.0
    port: 1883
    boss-threads: 1
    worker-threads: 0
    # 该接入在会话与下行路由中使用的协议类型，需与下行指令的 protocolType 一致
    protocol-type: mqtt
    # 单条 MQTT 报文上限（字节）
    max-message-size: 65536
    # 设备 PUBLISH 到该前缀下（含前缀本身）的主题视为上行数据
    uplink-topic-prefix: iotbridge/uplink
    # 网关向 <前缀>/<clientId> 发布下行指令；设备需先订阅该主题（可用 # / + 通配）
    downlink-topic-prefix: iotbridge/downlink
    # 下行 PUBLISH QoS：仅支持 0（至多一次）/ 1（至少一次，不跟踪客户端重传）
    qos: 0
    # 接入鉴权：username 为空允许匿名；非空时 CONNECT 必须携带匹配的用户名密码
    username: ${IOTBRIDGE_MQTT_USERNAME:}
    password: ${IOTBRIDGE_MQTT_PASSWORD:}
    # CONNECT keepalive 为 0 时的兜底读空闲秒数；非 0 时按 1.5 倍 keepalive 检测
    idle-seconds: 300
    write-buffer-high-water-mark: 65536
    write-buffer-low-water-mark: 32768
  # 管理端 REST 鉴权：api-key 非空时校验 X-Api-Key / Authorization: Bearer；留空则关闭（仅限本地开发）
  admin:
    api-key: ${IOTBRIDGE_API_KEY:}
  mq:
    uplink-topic: iotbridge.uplink
    downlink-queue: iotbridge.downlink
    downlink-exchange: iotbridge.downlink.exchange
    downlink-routing-key: downlink
    # 下行交换机类型：direct（单实例） / consistent-hash（多实例，按 deviceId 路由到对应实例队列）
    # 多实例部署必须用 consistent-hash，否则直连交换机同键多队列会广播造成重复下发
    downlink-exchange-type: direct
    # 实例标识：一致哈希模式下用于隔离各实例队列名，缺省取环境变量 HOSTNAME
    instance-id: ""
    # 下行发布同步等待 broker confirm 的超时（毫秒）；nack/超时即向 REST 返回失败，避免假成功
    downlink-confirm-timeout-ms: 5000
  # 下行离线暂存重投：默认关闭；开启后设备离线时按 deviceId 暂存原始指令，设备重新上线（收到上行）时重新编码并按序补发
  downlink:
    buffer-enabled: false
    max-pending-per-device: 100
    max-pending-devices: 10000
    pending-ttl-ms: 300000
    # 补发线程数：不同设备可并行补发，同设备顺序由分段锁保证
    reflow-threads: 4

logging:
  level:
    root: INFO
    com.iotbridge: INFO
